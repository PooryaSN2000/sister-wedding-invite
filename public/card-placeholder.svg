<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6" />
      <stop offset="50%" stop-color="#FBF6ED" />
      <stop offset="100%" stop-color="#F5EBDC" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CC" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#A57C30" />
      <stop offset="100%" stop-color="#FBF0D8" />
    </linearGradient>
    <radialGradient id="softGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EEDAC0" stop-opacity="0.2" />
    </radialGradient>
  </defs>

  <!-- پس زمینه کارت -->
  <rect width="600" height="850" rx="16" fill="url(#cardBg)" />
  <rect width="600" height="850" rx="16" fill="url(#softGlow)" />

  <!-- حاشیه طلایی دوبل لوکس -->
  <rect x="24" y="24" width="552" height="802" rx="12" fill="none" stroke="url(#gold)" stroke-width="2" />
  <rect x="34" y="34" width="532" height="782" rx="8" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="4,4" opacity="0.7" />

  <!-- نقوش گوشه‌ها -->
  <g stroke="url(#gold)" fill="none" stroke-width="1.5">
    <!-- بالا چپ -->
    <path d="M 38 68 C 38 48, 48 38, 68 38" />
    <circle cx="68" cy="38" r="3" fill="url(#gold)" />
    <!-- بالا راست -->
    <path d="M 562 68 C 562 48, 552 38, 532 38" />
    <circle cx="532" cy="38" r="3" fill="url(#gold)" />
    <!-- پایین چپ -->
    <path d="M 38 782 C 38 802, 48 812, 68 812" />
    <circle cx="68" cy="812" r="3" fill="url(#gold)" />
    <!-- پایین راست -->
    <path d="M 562 782 C 562 802, 552 812, 532 812" />
    <circle cx="532" cy="812" r="3" fill="url(#gold)" />
  </g>

  <!-- نماد تاج و گل بالای کارت -->
  <g transform="translate(300, 110)" text-anchor="middle">
    <path d="M -40 0 C -20 -15, 0 -25, 0 -25 C 0 -25, 20 -15, 40 0 C 20 -5, 0 -8, 0 -8 C 0 -8, -20 -5, -40 0 Z" fill="url(#gold)" />
    <circle cx="0" cy="-32" r="4" fill="url(#gold)" />
  </g>

  <!-- متن نمونه کارت -->
  <g text-anchor="middle" font-family="'Amiri', 'Vazirmatn', serif" fill="#3D322A">
    <text x="300" y="180" font-size="20" fill="#937332" letter-spacing="2">به نام پیوند‌دهنده دل‌ها</text>
    <text x="300" y="240" font-size="16" fill="#6B594B">در تمنای نگاهت که پر از باران است</text>
    <text x="300" y="275" font-size="16" fill="#6B594B">دل ما تا ابدیت به هم آمیخته است</text>
    
    <!-- موتیف پیوند -->
    <circle cx="280" cy="360" r="28" stroke="url(#gold)" stroke-width="3" fill="none" />
    <circle cx="320" cy="360" r="28" stroke="url(#gold)" stroke-width="3" fill="none" />
    <polygon points="320,326 327,336 320,344 313,336" fill="url(#gold)" />

    <!-- اسامی عروس و داماد -->
    <text x="300" y="450" font-size="34" font-weight="bold" fill="#7A222E">پانته‌آ و حسین</text>
    <text x="300" y="495" font-size="15" fill="#7D6F63">شما را به جشن پیوند آسمانی‌مان دعوت می‌نماییم</text>

    <!-- خط تزیینی جداکننده -->
    <path d="M 200 535 Q 300 545 400 535" stroke="url(#gold)" stroke-width="1.2" fill="none" />
    <circle cx="300" cy="538" r="3" fill="url(#gold)" />

    <!-- مشخصات تاریخ و ساعت -->
    <text x="300" y="585" font-size="20" font-weight="bold" fill="#3D322A">پنج‌شنبه ۲۴ مهرماه ۱۴۰۴</text>
    <text x="300" y="618" font-size="15" fill="#8C7A6B">ساعت ۱۸:۳۰ الی ۲۳:۳۰</text>

    <!-- مکان -->
    <text x="300" y="675" font-size="18" font-weight="bold" fill="#937332">باغ تالار عمارت بهشت</text>
    <text x="300" y="710" font-size="13" fill="#6B594B">تهران، گرمدره، خیابان کوهک، کوچه شقایق</text>
  </g>

  <!-- تگ نشان دهنده موقت بودن تصویر -->
  <g transform="translate(300, 770)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="rgba(197, 160, 89, 0.15)" stroke="url(#gold)" stroke-width="1" />
    <text x="0" y="5" font-size="12" font-family="'Vazirmatn', sans-serif" fill="#7A5B20">تصویر نمونه کارت عروسی (Static Image)</text>
  </g>
</svg>
